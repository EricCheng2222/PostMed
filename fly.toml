# fly.io configuration for the PostMed Notebook static site.
# Deploy with:  fly launch --copy-config --now      (first time)
#               fly deploy                          (subsequent)

app = "postmed-notebook"
primary_region = "hkg"          # Hong Kong — closest Fly region to Taiwan

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"   # scale to zero when idle; a static site costs nothing at rest
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.http_options.response.headers]
    X-Content-Type-Options = "nosniff"

  [[http_service.checks]]
    grace_period = "5s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  cpus = 1
